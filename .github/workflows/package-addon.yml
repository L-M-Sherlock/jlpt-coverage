name: Package Anki Add-on

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build .ankiaddon
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync project
        run: uv sync --locked

      - name: Compile Python sources
        run: |
          uv run python -m py_compile \
            jlpt_coverage/*.py \
            scripts/*.py \
            anki_addon/jlpt_coverage/__init__.py \
            anki_addon/jlpt_coverage/i18n.py

      - name: Package add-on
        run: uv run scripts/package_anki_addon.py

      - name: Validate add-on archive
        run: uv run scripts/validate_anki_addon.py

      - name: Upload add-on artifact
        uses: actions/upload-artifact@v4
        with:
          name: jlpt_coverage-ankiaddon
          path: dist/jlpt_coverage.ankiaddon
          if-no-files-found: error

      - name: Upload direct add-on asset to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/jlpt_coverage.ankiaddon --clobber
          else
            gh release create "$TAG_NAME" dist/jlpt_coverage.ankiaddon \
              --title "$TAG_NAME" \
              --notes "Automated JLPT Coverage add-on build."
          fi
